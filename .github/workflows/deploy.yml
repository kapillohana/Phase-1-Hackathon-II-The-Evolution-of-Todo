name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Hugging Face Hub CLI
      run: |
        pip install huggingface_hub

    - name: Deploy to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        SPACE_NAME: ${{ secrets.SPACE_NAME }}
      run: |
        # Navigate to the backend directory
        cd $GITHUB_WORKSPACE/phase-2/Phase-2/backend
        
        # Clone the existing space repository
        git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME} temp_space
        cd temp_space
        
        # Remove all files except .git directory
        find . -type 'f' -not -path './.git/*' -delete
        find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
        
        # Copy all files from the backend directory to the space
        rsync -av --exclude='temp_space/' $GITHUB_WORKSPACE/phase-2/Phase-2/backend/ ./
        
        # Configure git
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        
        # Add all files
        git add .
        
        # Check if there are changes to commit
        if ! git diff --cached --quiet; then
          git commit -m "Update Space from GitHub Actions"
          git push origin main
          echo "Changes pushed to Hugging Face Space"
        else
          echo "No changes detected, skipping push"
        fi